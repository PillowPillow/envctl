name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GOPROXY: "https://proxy.golang.org,off"
  GOFLAGS: "-mod=readonly"

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Verify module checksums
        run: go mod verify

      - name: shellcheck
        run: shellcheck install.sh homebrew/render-formula.sh

      - name: Check go.mod tidiness
        run: |
          GOFLAGS="" go mod tidy
          git diff --exit-code go.mod go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  test:
    runs-on: ubuntu-26.04
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install age and sops
        # Keep SOPS_VERSION and SOPS_SHA256 in sync with release.yaml and the Dockerfile (ARG SOPS_VERSION / SOPS_SHA256_AMD64).
        env:
          SOPS_VERSION: "3.13.3"
          SOPS_SHA256: "e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b"
        run: |
          sudo apt-get update
          sudo apt-get install -y age
          curl -fsSLo sops "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
          echo "${SOPS_SHA256}  sops" | sha256sum -c -
          sudo install -m 0755 sops /usr/local/bin/sops
          rm sops

      - name: Tests
        env:
          CI: "true"
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out
