# Builds and releases envctl binaries, the Docker image and the Homebrew formula when a tag is pushed
name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

env:
  GOPROXY: "https://proxy.golang.org,off"
  GOFLAGS: "-mod=readonly"

jobs:
  release:
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check the tag is a version
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag $GITHUB_REF_NAME is not vX.Y.Z" >&2; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install syft (SBOM)
        env:
          SYFT_VERSION: "1.54.0"
          SYFT_SHA256: "54a87372498168b2d033e876fd41fa4e8035b872699e525a57046e1f2f09c860"
        run: |
          curl -fsSLo syft.tar.gz "https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "${SYFT_SHA256}  syft.tar.gz" | sha256sum -c -
          tar -xzf syft.tar.gz syft
          sudo install -m 0755 syft /usr/local/bin/syft
          rm syft syft.tar.gz

      - name: Install age and sops
        # Keep SOPS_VERSION and SOPS_SHA256 in sync with ci.yaml and the Dockerfile (ARG SOPS_VERSION / SOPS_SHA256_AMD64).
        env:
          SOPS_VERSION: "3.13.3"
          SOPS_SHA256: "e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b"
        run: |
          sudo apt-get update
          sudo apt-get install -y age
          curl -fsSLo sops "https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
          echo "${SOPS_SHA256}  sops" | sha256sum -c -
          sudo install -m 0755 sops /usr/local/bin/sops
          rm sops

      - name: Run tests
        run: go test -race -count=1 ./...

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt

      # GoReleaser leaves a draft so nobody downloads archives before their attestation exists.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  docker:
    runs-on: ubuntu-26.04
    needs: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Download release binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p bin/linux-amd64 bin/linux-arm64
          gh release download "v${VERSION}" --pattern "envctl_linux_amd64.tar.gz" --output - | tar -xz -C bin/linux-amd64
          gh release download "v${VERSION}" --pattern "envctl_linux_arm64.tar.gz" --output - | tar -xz -C bin/linux-arm64

      - name: Build and push multi-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/pillowpillow/envctl:${{ env.VERSION }}
            ghcr.io/pillowpillow/envctl:latest

  tap:
    runs-on: ubuntu-26.04
    needs: release
    environment: release
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download and verify checksums.txt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern checksums.txt
          gh attestation verify checksums.txt --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yaml"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PillowPillow/homebrew-tap
          # A deploy key that can write to the tap only; the workflow token cannot push to another repository.
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
          path: tap

      - name: Update the Homebrew formula
        run: |
          mkdir -p tap/Formula
          homebrew/render-formula.sh "${GITHUB_REF_NAME#v}" checksums.txt > tap/Formula/envctl.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/envctl.rb
          git diff --cached --quiet && exit 0
          git commit -m "Brew formula update for envctl version $GITHUB_REF_NAME"
          git push

  smoke:
    needs: [tap, docker]
    permissions:
      contents: read
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install with curl
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ENVCTL_VERSION="$GITHUB_REF_NAME" INSTALL_DIR="$RUNNER_TEMP/curl" bash install.sh
          "$RUNNER_TEMP/curl/envctl" version | grep -Fx "envctl ${GITHUB_REF_NAME#v}"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install with go install
        run: |
          GOBIN="$RUNNER_TEMP/go" go install "github.com/PillowPillow/envctl/v2@$GITHUB_REF_NAME"
          "$RUNNER_TEMP/go/envctl" version | grep -Fx "envctl ${GITHUB_REF_NAME#v}"

      - name: Install with Homebrew
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          command -v brew >/dev/null || eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install pillowpillow/tap/envctl
          brew test envctl
          "$(brew --prefix)/bin/envctl" version | grep -Fx "envctl ${GITHUB_REF_NAME#v}"
