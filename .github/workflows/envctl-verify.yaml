# Reusable workflow for verifying envctl environments in CI.
#
# Usage in your project's .github/workflows/ci.yaml:
#
#   jobs:
#     envctl:
#       uses: PillowPillow/envctl/.github/workflows/envctl-verify.yaml@main
#       with:
#         environment: production
#         github-environment: production
#       secrets: inherit

name: envctl verify

on:
  workflow_call:
    inputs:
      environment:
        description: "Environment to verify (e.g. production, staging)"
        required: true
        type: string
      envctl-version:
        description: "envctl image tag (e.g. 0.1.0, latest)"
        required: false
        type: string
        default: latest
      github-environment:
        description: "GitHub environment for accessing environment-scoped secrets"
        required: true
        type: string

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: ${{ inputs.github-environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify environment
        uses: PillowPillow/envctl@main
        with:
          command: verify
          environment: ${{ inputs.environment }}
          envctl-version: ${{ inputs.envctl-version }}
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
