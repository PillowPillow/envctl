# Reusable workflow for consumer repos.
# Uses the pre-built Docker image — zero install time.
#
# Usage in your project's .github/workflows/ci.yaml:
#
#   jobs:
#     envctl:
#       uses: PillowPillow/envctl/.github/workflows/envctl-verify.yaml@main
#       with:
#         environment: production
#         github-environment: production
#       secrets: inherit

name: envctl verify

on:
  workflow_call:
    inputs:
      environment:
        description: "Environment to verify (e.g. production, staging)"
        required: true
        type: string
      envctl-version:
        description: "envctl image tag (e.g. 0.1.0, latest)"
        required: false
        type: string
        default: latest
      generate:
        description: "Also run envctl generate after verify"
        required: false
        type: boolean
        default: false
      output-path:
        description: "Output path for generate (default: .env)"
        required: false
        type: string
        default: .env
      github-environment:
        description: "GitHub environment for accessing environment-scoped secrets"
        required: true
        type: string

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: ${{ inputs.github-environment }}
    steps:
      - uses: actions/checkout@v6

      - name: Pull envctl image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull ghcr.io/pillowpillow/envctl:${{ inputs.envctl-version }}

      - name: Verify environment
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -e SOPS_AGE_KEY \
            ghcr.io/pillowpillow/envctl:${{ inputs.envctl-version }} \
            verify --env ${{ inputs.environment }} --strict
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

      - name: Generate env file
        if: ${{ inputs.generate }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            -u "$(id -u):$(id -g)" \
            -e SOPS_AGE_KEY \
            ghcr.io/pillowpillow/envctl:${{ inputs.envctl-version }} \
            generate --env ${{ inputs.environment }} -o ${{ inputs.output-path }}
          ls -la "${{ inputs.output-path }}"
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}

      - name: Upload generated env
        if: ${{ inputs.generate }}
        uses: actions/upload-artifact@v7
        with:
          name: env-${{ inputs.environment }}
          path: ${{ inputs.output-path }}
          retention-days: 1
