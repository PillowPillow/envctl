name: envctl
description: "Run envctl commands (verify, generate) using the Docker image"

inputs:
  command:
    description: "Command to run: verify or generate"
    required: true
  environment:
    description: "Target environment (e.g. production, staging, local)"
    required: true
  envctl-version:
    description: "envctl image tag"
    required: false
    default: latest
  output-path:
    description: "Output path for generate (default: .env)"
    required: false
    default: .env
  strict:
    description: "Treat warnings as errors for verify"
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Pull envctl image
      shell: bash
      env:
        GHCR_TOKEN: ${{ github.token }}
        ENVCTL_IMAGE_TAG: ${{ inputs.envctl-version }}
      run: |
        echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        docker pull "ghcr.io/pillowpillow/envctl:${ENVCTL_IMAGE_TAG}"

    - name: Run envctl verify
      if: inputs.command == 'verify'
      shell: bash
      env:
        ENVCTL_ENV: ${{ inputs.environment }}
        ENVCTL_IMAGE_TAG: ${{ inputs.envctl-version }}
        ENVCTL_STRICT: ${{ inputs.strict }}
      run: |
        args=(verify --env "$ENVCTL_ENV")
        [[ "$ENVCTL_STRICT" == true ]] && args+=(--strict)
        docker run --rm \
          -v "${GITHUB_WORKSPACE}:/workspace" \
          -w /workspace \
          -e SOPS_AGE_KEY \
          "ghcr.io/pillowpillow/envctl:${ENVCTL_IMAGE_TAG}" \
          "${args[@]}"

    - name: Run envctl generate
      if: inputs.command == 'generate'
      shell: bash
      env:
        ENVCTL_ENV: ${{ inputs.environment }}
        ENVCTL_OUTPUT: ${{ inputs.output-path }}
        ENVCTL_IMAGE_TAG: ${{ inputs.envctl-version }}
      run: |
        docker run --rm \
          -v "${GITHUB_WORKSPACE}:/workspace" \
          -w /workspace \
          -u "$(id -u):$(id -g)" \
          -e SOPS_AGE_KEY \
          "ghcr.io/pillowpillow/envctl:${ENVCTL_IMAGE_TAG}" \
          generate --env "$ENVCTL_ENV" -o "$ENVCTL_OUTPUT"
