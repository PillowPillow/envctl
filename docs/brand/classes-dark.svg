<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 140" width="820" height="140" role="img"><title>Three kinds of variable: static, required and optional</title><rect x="0.5" y="0.5" width="819" height="139" rx="12" fill="#1F1B19" stroke="#3A332E"/><g transform="translate(110 14) scale(.5)"><rect x="22" y="44" width="56" height="12" rx="6" fill="#BDB3A9"/></g><g transform="translate(385 14) scale(.5)"><g fill="none" stroke="#F4F0EA" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M30 15 C20 15 20 20 20 30 L20 42 C20 48 16 50 12 50 C16 50 20 52 20 58 L20 70 C20 80 20 85 30 85"/><path d="M70 15 C80 15 80 20 80 30 L80 42 C80 48 84 50 88 50 C84 50 80 52 80 58 L80 70 C80 80 80 85 70 85"/></g><circle cx="50" cy="50" r="15" fill="#E58A6B"/></g><g transform="translate(660 14) scale(.5)"><g fill="none" stroke="#F4F0EA" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M30 15 C20 15 20 20 20 30 L20 42 C20 48 16 50 12 50 C16 50 20 52 20 58 L20 70 C20 80 20 85 30 85"/><path d="M70 15 C80 15 80 20 80 30 L80 42 C80 48 84 50 88 50 C84 50 80 52 80 58 L80 70 C80 80 80 85 70 85"/></g><circle cx="50" cy="50" r="13" fill="none" stroke="#E58A6B" stroke-width="5"/><path d="M50 37 A13 13 0 0 1 50 63 Z" fill="#E58A6B"/></g><text x="135" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#F4F0EA" text-anchor="middle">VAR=value</text><text x="135" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#BDB3A9" text-anchor="middle">static · kept as written</text><text x="410" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#F4F0EA" text-anchor="middle">VAR=${VAR}</text><text x="410" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#BDB3A9" text-anchor="middle">required · verify fails without it</text><text x="685" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#F4F0EA" text-anchor="middle">VAR=${VAR:-default}</text><text x="685" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#BDB3A9" text-anchor="middle">optional · falls back to the default</text></svg>
