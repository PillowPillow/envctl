<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 240" width="1040" height="240" role="img"><title>envctl — Your repo holds every secret it needs. One key opens it.</title><rect x="0.5" y="0.5" width="1039" height="239" rx="18" fill="#F6F3EA" stroke="#E5DED3"/><g transform="translate(44 45) scale(1.5)"><g fill="none" stroke="#1F1B18" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M30 15 C20 15 20 20 20 30 L20 42 C20 48 16 50 12 50 C16 50 20 52 20 58 L20 70 C20 80 20 85 30 85"/><path d="M70 15 C80 15 80 20 80 30 L80 42 C80 48 84 50 88 50 C84 50 80 52 80 58 L80 70 C80 80 80 85 70 85"/></g><circle cx="50" cy="50" r="15" fill="#B4472E"/><circle cx="50" cy="46" r="4" fill="#F6F3EA"/><rect x="48" y="48" width="4" height="9" rx="1" fill="#F6F3EA"/></g><text x="232" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="46" font-weight="600" fill="#1F1B18">envctl</text><text x="232" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#1F1B18">Your repo holds every secret it needs. One key opens it.</text><text x="232" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5A514A">Encrypted in git, no external vault. Each key opens only the environments it should.</text><text x="232" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5A514A">Your .env.example is the contract, and CI enforces it.</text></svg>
