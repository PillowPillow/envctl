<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" width="820" height="290" role="img"><title>Who can open what: alice opens every environment, bob only local, ci staging and production, ops only production</title><rect x="0.5" y="0.5" width="819" height="289" rx="12" fill="#F6F3EA" stroke="#E5DED3"/><text x="450" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1F1B18" text-anchor="middle" font-weight="700">local</text><text x="570" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1F1B18" text-anchor="middle" font-weight="700">staging</text><text x="690" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1F1B18" text-anchor="middle" font-weight="700">production</text><text x="36" y="90" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1F1B18" font-weight="700">alice</text><text x="110" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5A514A">lead · global key</text><g class="open"><circle cx="450" cy="86" r="12" fill="#B4472E"/><circle cx="450" cy="83" r="3" fill="#F6F3EA"/><rect x="448.5" y="85" width="3" height="7" rx="1" fill="#F6F3EA"/></g><g class="open"><circle cx="570" cy="86" r="12" fill="#B4472E"/><circle cx="570" cy="83" r="3" fill="#F6F3EA"/><rect x="568.5" y="85" width="3" height="7" rx="1" fill="#F6F3EA"/></g><g class="open"><circle cx="690" cy="86" r="12" fill="#B4472E"/><circle cx="690" cy="83" r="3" fill="#F6F3EA"/><rect x="688.5" y="85" width="3" height="7" rx="1" fill="#F6F3EA"/></g><path d="M30 109 H790" stroke="#E5DED3"/><text x="36" y="136" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1F1B18" font-weight="700">bob</text><text x="110" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5A514A">developer · --env local</text><g class="open"><circle cx="450" cy="132" r="12" fill="#B4472E"/><circle cx="450" cy="129" r="3" fill="#F6F3EA"/><rect x="448.5" y="131" width="3" height="7" rx="1" fill="#F6F3EA"/></g><g class="closed"><circle cx="570" cy="132" r="11" fill="none" stroke="#5A514A" stroke-width="1.5"/></g><g class="closed"><circle cx="690" cy="132" r="11" fill="none" stroke="#5A514A" stroke-width="1.5"/></g><path d="M30 155 H790" stroke="#E5DED3"/><text x="36" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1F1B18" font-weight="700">ci</text><text x="110" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5A514A">CI runner · --env staging, production</text><g class="closed"><circle cx="450" cy="178" r="11" fill="none" stroke="#5A514A" stroke-width="1.5"/></g><g class="open"><circle cx="570" cy="178" r="12" fill="#B4472E"/><circle cx="570" cy="175" r="3" fill="#F6F3EA"/><rect x="568.5" y="177" width="3" height="7" rx="1" fill="#F6F3EA"/></g><g class="open"><circle cx="690" cy="178" r="12" fill="#B4472E"/><circle cx="690" cy="175" r="3" fill="#F6F3EA"/><rect x="688.5" y="177" width="3" height="7" rx="1" fill="#F6F3EA"/></g><path d="M30 201 H790" stroke="#E5DED3"/><text x="36" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1F1B18" font-weight="700">ops</text><text x="110" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5A514A">ops · --env production</text><g class="closed"><circle cx="450" cy="224" r="11" fill="none" stroke="#5A514A" stroke-width="1.5"/></g><g class="closed"><circle cx="570" cy="224" r="11" fill="none" stroke="#5A514A" stroke-width="1.5"/></g><g class="open"><circle cx="690" cy="224" r="12" fill="#B4472E"/><circle cx="690" cy="221" r="3" fill="#F6F3EA"/><rect x="6